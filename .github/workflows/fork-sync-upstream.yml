name: Sync upstream

# Daily maintenance for this patch-fork of ahXN00/OwnTV. This fork's main carries the
# AI-subtitle patches on top of upstream; this workflow:
#   1. mirrors upstream main into a local 'upstream' branch (fast-forward by construction —
#      never conflicts, so the mirror is ALWAYS current, even when step 2 fails);
#   2. rebases main onto that mirror and force-pushes, preserving this fork's patches on the
#      newest upstream base.
# A conflicting rebase fails loudly and must be resolved locally (see the error message).
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so fork-release.yml also
# listens for this workflow's completion via workflow_run.
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror upstream main into the 'upstream' branch
        run: |
          git remote add upstream https://github.com/ahXN00/OwnTV.git
          git fetch upstream main
          git push origin "refs/remotes/upstream/main:refs/heads/upstream" --force

      - name: Rebase main onto upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          if git rebase upstream/main; then
            git push --force-with-lease origin main
          else
            git rebase --abort
            echo "::error::Rebase onto ahXN00/OwnTV main hit conflicts. The 'upstream' branch IS updated (step 2), so the divergence is inspectable. Resolve locally: git fetch origin upstream && git rebase origin/upstream && git push --force-with-lease origin main"
            exit 1
          fi
