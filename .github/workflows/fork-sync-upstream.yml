name: Sync upstream

# Daily maintenance for this patch-fork of ahXN00/OwnTV. This fork carries the AI-subtitle
# patches on top of upstream, and the 'core' branch carries the core-module patches (mirrored
# from ahXN00/OwnTV_Core). This workflow:
#   1. merges upstream main into main (no history rewrite, no force push — a merge conflict is
#      a smaller, more inspectable event than a rebase replay of every fork commit);
#   2. merges ahXN00/OwnTV_Core main into the 'core' branch the same way.
#
# Authentication: plain GITHUB_TOKEN (contents: write). Upstream's commits carry its own
# .github/workflows files, and a GitHub App token can never create, update or delete workflow
# files — so each merge restores .github/workflows to whatever this repo already has and amends
# the merge commit before pushing. The push therefore never carries a workflow-file change and
# needs no personal token: nothing here expires. Upstream CI changes (rare) are picked up by
# hand when wanted.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so fork-release.yml also
# listens for this workflow's completion via workflow_run.
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ahXN00/OwnTV.git
          git fetch upstream main
          UP_SHA="$(git rev-parse --short=12 FETCH_HEAD)"
          echo "upstream main: $UP_SHA"
          BEFORE="$(git rev-parse HEAD)"
          if git merge FETCH_HEAD --no-edit -m "Merge upstream into main ($UP_SHA)"; then
            if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
              echo "main is already at upstream $UP_SHA — nothing to merge."
            else
              # Neutralise workflow files: the push must not carry any .github/workflows change.
              if ! git diff --quiet origin/main HEAD -- .github/workflows; then
                git rm -rq --ignore-unmatch .github/workflows
                git checkout origin/main -- .github/workflows
                git commit --amend --no-edit
                echo "upstream workflow changes were dropped from the merge (restore by hand if wanted)."
              fi
              git push origin main
            fi
          else
            git merge --abort
            echo "::error::Merge of ahXN00/OwnTV main hit conflicts. Resolve locally: git remote add upstream https://github.com/ahXN00/OwnTV.git && git fetch upstream main && git merge FETCH_HEAD && git push origin main"
            exit 1
          fi

      - name: Merge upstream core into the core branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add core-upstream https://github.com/ahXN00/OwnTV_Core.git
          git fetch core-upstream main
          UP_SHA="$(git rev-parse --short=12 FETCH_HEAD)"
          echo "upstream core main: $UP_SHA"
          BEFORE="$(git rev-parse HEAD)"
          git checkout core
          if git merge FETCH_HEAD --no-edit -m "Merge upstream core ($UP_SHA)"; then
            if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
              echo "core is already at upstream $UP_SHA — nothing to merge."
            else
              if ! git diff --quiet origin/core HEAD -- .github/workflows; then
                git rm -rq --ignore-unmatch .github/workflows
                git checkout origin/core -- .github/workflows
                git commit --amend --no-edit
                echo "upstream core workflow changes were dropped from the merge (restore by hand if wanted)."
              fi
              git push origin core
            fi
          else
            git merge --abort
            echo "::error::Merge of ahXN00/OwnTV_Core main hit conflicts. Resolve locally: git remote add core-upstream https://github.com/ahXN00/OwnTV_Core.git && git fetch core-upstream main && git checkout core && git merge FETCH_HEAD && git push origin core"
            exit 1
          fi

      - name: Open an issue when sync needs a human
        # A failed sync silently stalls the fork (main keeps the last good state and no release
        # runs — the release workflow's workflow_run guard requires a successful sync). The red X
        # in Actions is invisible to someone who does not watch CI daily, so surface it as an
        # issue instead — one at a time, updated with each new failure date.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Daily upstream sync needs manual resolution"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')"
          TODAY="$(date -u +%F)"
          BODY=$(cat <<EOM
          The daily sync workflow failed on $TODAY — the merge hit conflicts. **The fork is safe**
          (main still holds the last good state and no broken release was published), but new
          upstream work is NOT being picked up until this is resolved.

          Run: $RUN_URL

          Fix locally, from this repository:
          \`\`\`
          git remote add upstream https://github.com/ahXN00/OwnTV.git
          git fetch upstream main
          git checkout main && git merge FETCH_HEAD
          git remote add core-upstream https://github.com/ahXN00/OwnTV_Core.git
          git fetch core-upstream main
          git checkout core && git merge FETCH_HEAD
          git push origin main core
          \`\`\`
          Then close this issue — the next daily run resumes automatically.
          EOM
          )
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" --body "Failed again on $TODAY — see $RUN_URL"
          fi
