name: Sync upstream

# Daily maintenance for this patch-fork of ahXN00/OwnTV. This fork carries the AI-subtitle
# patches on top of upstream, and the 'core' branch carries the core-module patches (mirrored
# from ahXN00/OwnTV_Core). This workflow:
#   1. mirrors upstream main into a local 'upstream' branch (fast-forward by construction —
#      never conflicts, so the mirror is ALWAYS current, even when step 2 fails);
#   2. merges that mirror into main (no history rewrite, no force push — a merge conflict is
#      a smaller, more inspectable event than a rebase replay of every fork commit);
#   3. mirrors ahXN00/OwnTV_Core main into a 'core-upstream' branch and merges the 'core'
#      branch onto it the same way.
# A conflicting merge fails loudly and must be resolved locally (see the error message).
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so fork-release.yml also
# listens for this workflow's completion via workflow_run.
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # The upstream mirror carries upstream's own workflow files (.github/workflows/*) —
  # a push that creates or updates them is refused without this scope.
  workflows: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror upstream main into the 'upstream' branch
        run: |
          git remote add upstream https://github.com/ahXN00/OwnTV.git
          git fetch upstream main
          git push origin "refs/remotes/upstream/main:refs/heads/upstream" --force

      - name: Merge upstream into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          if git merge upstream/main --no-edit -m "Merge upstream into main (daily sync)"; then
            git push origin main
          else
            git merge --abort
            echo "::error::Merge of ahXN00/OwnTV main hit conflicts. The 'upstream' branch IS updated (step 2), so the divergence is inspectable. Resolve locally: git fetch origin upstream && git merge origin/upstream && git push origin main"
            exit 1
          fi

      - name: Mirror upstream core into the 'core-upstream' branch
        run: |
          git remote add core-upstream https://github.com/ahXN00/OwnTV_Core.git
          git fetch core-upstream main
          git push origin "refs/remotes/core-upstream/main:refs/heads/core-upstream" --force

      - name: Merge upstream into core
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout core
          if git merge core-upstream/main --no-edit -m "Merge upstream core (daily sync)"; then
            git push origin core
          else
            git merge --abort
            echo "::error::Merge of ahXN00/OwnTV_Core main hit conflicts. The 'core-upstream' branch IS updated, so the divergence is inspectable. Resolve locally: git fetch origin core-upstream && git checkout core && git merge origin/core-upstream && git push origin core"
            exit 1
          fi

      - name: Open an issue when sync needs a human
        # A failed sync silently stalls the fork (main keeps the last good state and no release
        # runs — the release workflow's workflow_run guard requires a successful sync). The red X
        # in Actions is invisible to someone who does not watch CI daily, so surface it as an
        # issue instead — one at a time, updated with each new failure date.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Daily upstream sync needs manual resolution"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')"
          TODAY="$(date -u +%F)"
          BODY=$(cat <<EOM
          The daily sync workflow failed on $TODAY — a rebase hit conflicts or the mirror push was refused. **The fork is safe** (main still holds the last good state and no broken release was published), but new upstream work is NOT being picked up until this is resolved.

          Run: $RUN_URL

          Fix locally, from this repository:
          \`\`\`
          git fetch origin upstream
          git checkout main && git merge origin/upstream
          git fetch origin core-upstream
          git checkout core && git merge origin/core-upstream
          git push origin main core
          \`\`\`
          Then close this issue — the next daily run resumes automatically.
          EOM
          )
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" --body "Failed again on $TODAY — see $RUN_URL"
          fi
