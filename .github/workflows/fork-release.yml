name: Fork release

# Builds the AI-subtitle APK from THIS fork and refreshes a rolling 'latest' GitHub Release,
# which the TV app's updater polls (public repo — the updater needs no token).
#
# Core resolution: the core source lives on the 'core' branch of THIS repo (mirrored from
# ahXN00/OwnTV_Core by the sync workflow). It is checked out next to the app and fed to
# Gradle via the official -Powntv.corePath substitution — no GitHub Packages token needed.
#
# versionName: semantic "<major>.<minor>.<patch>", read from the VERSION file (major.minor,
# bumped by hand for milestones) with the patch auto-incremented per release. Every release is
# published under its own v-tag and KEPT — the Releases page is the version history — and the
# in-app updater resolves the newest one via /releases/latest. versionCode stays epoch minutes:
# strictly monotonic and the same formula local sandbox builds pass, so release and local builds
# form one ordered update chain (a newer local build installs over an older release and vice
# versa); the update dialog shows the semantic name while ordering stays numeric.
#
# Triggers: direct pushes to main, manual dispatch, and — because GITHUB_TOKEN pushes do not
# trigger workflows — the successful completion of "Sync upstream" (which rebases main onto
# new upstream commits; those pushes alone would otherwise never produce a release).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: [ "Sync upstream" ]
    types: [ completed ]
  # Core rebase pushes made with GITHUB_TOKEN cannot trigger workflows here, so the daily
  # run below is what turns a core-side sync into a fresh release. The sha guard compares
  # BOTH the app and core tips and skips the build only when neither changed.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  release:
    # workflow_run fires even when the sync failed; only release off a successful sync of
    # main. Push/dispatch events pass straight through.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Checkout core branch (source substitution, no packages token)
        uses: actions/checkout@v4
        with:
          ref: core
          path: OwnTV_Core

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Skip when both tips are already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR_SHA="$(git rev-parse --short=12 HEAD)"
          CUR_CORE="$(git rev-parse --short=12 origin/core)"
          # The newest release by date — whichever v-tag holds it — carries the tips it was
          # built from in its notes; equal tips mean nothing new to release.
          BODY="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .body 2>/dev/null || true)"
          LAST_SHA="$(echo "$BODY" | grep -oE 'sha=[0-9a-f]+' | head -1 | cut -d= -f2 || true)"
          LAST_CORE="$(echo "$BODY" | grep -oE 'core=[0-9a-f]+' | head -1 | cut -d= -f2 || true)"
          echo "cur=$CUR_SHA core=$CUR_CORE last=$LAST_SHA lastcore=$LAST_CORE"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CUR_SHA" ] && \
             [ -n "$LAST_CORE" ] && [ "$LAST_CORE" = "$CUR_CORE" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Stamp the build version
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJMIN="$(tr -d '[:space:]' < VERSION)"
          LAST="$(git ls-remote --tags origin "v${MAJMIN}.*" | grep -v '\^{}' | grep -oE "v${MAJMIN}\.[0-9]+$" | sed "s/v${MAJMIN}\.//" | sort -n | tail -1)"
          # The first release under a new major.minor is .0 (semver: 1.0.0 is the first stable).
          if [ -n "$LAST" ]; then PATCH="$(( LAST + 1 ))"; else PATCH=0; fi
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${MAJMIN}.${PATCH}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${MAJMIN}.${PATCH}" >> "$GITHUB_ENV"

      - name: Quality gates (i18n ratchet + unit tests)
        if: env.SKIP != 'true'
        run: |
          # The release gate for automatic upstream syncs: a rebase can compile cleanly and still
          # regress behaviour or leak untranslatable literals. Any failure here aborts the job, so
          # the Sign/Release steps below never run and the rolling 'latest' keeps the last good
          # build — devices are never offered a broken update.
          ./gradlew \
            :app:verifyI18nLiterals \
            :OwnTV_Core:core:verifyI18nLiterals \
            :app:testStandardDebugUnitTest \
            :OwnTV_Core:core:testDebugUnitTest \
            :OwnTV_Core:player-core:testDebugUnitTest \
            -Powntv.corePath="$GITHUB_WORKSPACE/OwnTV_Core" \
            --stacktrace --no-daemon

      - name: Build standard debug APK
        if: env.SKIP != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug \
            -Powntv.corePath="$GITHUB_WORKSPACE/OwnTV_Core" \
            --stacktrace --no-daemon

      - name: Sign with the update key
        if: env.SKIP != 'true'
        env:
          KS_B64: ${{ secrets.OWNDBG_KS_B64 }}
          KS_PASS: ${{ secrets.OWNDBG_KS_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret OWNDBG_KS_B64 is missing — see FORK_SETUP.md. CI builds must carry the same signature as installed devices, or the auto-update install is refused."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > update.keystore
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          "$BT/apksigner" sign \
            --ks update.keystore --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias owntv-debug \
            --out "OwnTV-AI-${VERSION_CODE}.apk" \
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
          "$BT/apksigner" verify --print-certs "OwnTV-AI-${VERSION_CODE}.apk" | sed -n 2p
          # The standard APK is universal (every ABI). The in-app updater picks its asset on the
          # x86_64 name marker, so publish the same file under both names: TVs match the plain
          # name, x86_64 emulators match the suffixed one.
          cp "OwnTV-AI-${VERSION_CODE}.apk" "OwnTV-AI-x86_64-${VERSION_CODE}.apk"

      - name: Publish release ${{ env.RELEASE_TAG }} (kept permanently)
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="versionCode=${VERSION_CODE} name=${VERSION_NAME} sha=$(git rev-parse --short=12 HEAD) core=$(git rev-parse --short=12 origin/core)"
          # One release per build, published under its own tag and never deleted: the Releases
          # page is the version history. If a previous attempt died after tagging, reuse it.
          gh release create "$RELEASE_TAG" "OwnTV-AI-${VERSION_CODE}.apk" "OwnTV-AI-x86_64-${VERSION_CODE}.apk" \
            --title "OwnTV-AI ${VERSION_NAME}" \
            --notes "$NOTES" \
          || {
            gh release upload "$RELEASE_TAG" "OwnTV-AI-${VERSION_CODE}.apk" "OwnTV-AI-x86_64-${VERSION_CODE}.apk" --clobber
            gh release edit "$RELEASE_TAG" --title "OwnTV-AI ${VERSION_NAME}" --notes "$NOTES"
          }
