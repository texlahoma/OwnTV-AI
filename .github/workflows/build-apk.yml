name: Build OwnTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: owntv-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OwnTV Android TV APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. 拉取 OwnTV 官方源码
      # ------------------------------------------------------------
      - name: Checkout OwnTV source
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: main
          path: OwnTV

      # ------------------------------------------------------------
      # 2. 拉取 OwnTV_Core 官方源码
      # ------------------------------------------------------------
      - name: Checkout OwnTV Core source
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: main
          path: OwnTV_Core

      # ------------------------------------------------------------
      # 3. Java 21
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ------------------------------------------------------------
      # 5. 安装 OwnTV 所需 Android 37 SDK
      # ------------------------------------------------------------
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      # ------------------------------------------------------------
      # 6. Gradle
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------
      # 7. 检查源码和 Gradle
      # ------------------------------------------------------------
      - name: Verify source tree
        working-directory: OwnTV
        run: |
          echo "===== OwnTV ====="
          ls -la

          echo "===== Gradle wrapper ====="
          ls -la gradlew gradle/wrapper/gradle-wrapper.properties

          echo "===== Gradle version ====="
          chmod +x ./gradlew
          ./gradlew --version

      # ------------------------------------------------------------
      # 8. 检查 OwnTV_Core
      # ------------------------------------------------------------
      - name: Verify OwnTV Core
        run: |
          echo "===== OwnTV_Core ====="
          ls -la OwnTV_Core

      # ------------------------------------------------------------
      # 9. 编译 ARM Android TV Debug APK
      # ------------------------------------------------------------
      - name: Build Standard Debug APK
        working-directory: OwnTV
        run: |
          chmod +x ./gradlew

          ./gradlew \
            :app:assembleStandardDebug \
            -Powntv.corePath="$GITHUB_WORKSPACE/OwnTV_Core" \
            --stacktrace \
            --no-daemon

      # ------------------------------------------------------------
      # 10. 查找 APK
      # ------------------------------------------------------------
      - name: Find generated APK
        working-directory: OwnTV
        run: |
          echo "===== Generated APK ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 11. 验证 APK
      # ------------------------------------------------------------
      - name: Verify APK
        working-directory: OwnTV
        run: |
          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK size:"
          du -h "$APK"

      # ------------------------------------------------------------
      # 12. 上传 APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-AI-standard-debug
          path: OwnTV/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
